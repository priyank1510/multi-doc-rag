<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Doc RAG</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1c1f24; --muted:#6b7280; --border:#e3e6ea; --accent:#2f6fde; --user:#e8f0fe; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --panel:#1d2025; --text:#e6e8eb; --muted:#9aa1ab; --border:#2c3037; --accent:#6ea0ff; --user:#24324a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  .app { display:grid; grid-template-columns:280px 1fr; height:100vh; }
  aside { border-right:1px solid var(--border); background:var(--panel); padding:16px; overflow:auto; }
  main { display:flex; flex-direction:column; min-width:0; }
  h1 { font-size:17px; margin:0 0 4px; }
  .muted { color:var(--muted); font-size:13px; }
  .drop { border:1px dashed var(--border); border-radius:8px; padding:14px; text-align:center; margin:14px 0; cursor:pointer; }
  .drop.over { border-color:var(--accent); }
  .doc { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .doc span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button { font:inherit; border:1px solid var(--border); background:var(--panel); color:var(--text); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.x { padding:2px 8px; }
  #log { flex:1; overflow:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:780px; padding:10px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--border); white-space:pre-wrap; }
  .msg.user { align-self:flex-end; background:var(--user); }
  details { margin-top:8px; font-size:13px; color:var(--muted); }
  .src { border-left:3px solid var(--accent); padding:4px 8px; margin:6px 0; }
  form { display:flex; gap:8px; padding:14px 20px; border-top:1px solid var(--border); background:var(--panel); }
  input[type=text] { flex:1; font:inherit; padding:9px 12px; border-radius:6px; border:1px solid var(--border); background:var(--bg); color:var(--text); }
  @media (max-width:720px) { .app { grid-template-columns:1fr; grid-template-rows:auto 1fr; height:auto; min-height:100vh; } aside { border-right:0; border-bottom:1px solid var(--border); } }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Multi-Doc RAG</h1>
    <div class="muted" id="mode">…</div>
    <label class="drop" id="drop">Drop PDFs here or click to upload
      <input type="file" id="file" accept="application/pdf" multiple hidden>
    </label>
    <div class="muted" id="status"></div>
    <div id="docs"></div>
  </aside>
  <main>
    <div id="log"><div class="msg">Upload one or more PDFs, then ask a question. Follow-up questions keep context.</div></div>
    <form id="ask">
      <input type="text" id="q" placeholder="Ask about your documents…" autocomplete="off">
      <button class="primary">Send</button>
      <button type="button" id="reset">New chat</button>
    </form>
  </main>
</div>
<script>
let sessionId = null;
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, opts = {}) {
  const r = await fetch(path, opts);
  const body = await r.json();
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}

async function refresh() {
  const h = await api("/health");
  $("mode").textContent = `Answer mode: ${h.llm} · ${h.chunks} chunks indexed`;
  const { documents } = await api("/documents");
  $("docs").innerHTML = documents.map(d =>
    `<div class="doc"><span title="${esc(d.name)}">${esc(d.name)}<br><small class="muted">${d.pages} pages · ${d.chunks} chunks</small></span>
     <button class="x" data-id="${d.doc_id}" title="Remove">×</button></div>`).join("") || '<p class="muted">No documents yet.</p>';
}

async function upload(files) {
  const fd = new FormData();
  [...files].forEach(f => fd.append("files", f));
  $("status").textContent = "Indexing…";
  try { await api("/documents", { method: "POST", body: fd }); $("status").textContent = ""; }
  catch (e) { $("status").textContent = e.message; }
  refresh();
}

function add(role, html) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerHTML = html;
  $("log").appendChild(div);
  $("log").scrollTop = $("log").scrollHeight;
  return div;
}

$("file").onchange = e => upload(e.target.files);
const drop = $("drop");
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); upload(e.dataTransfer.files); };

$("docs").onclick = async e => {
  if (!e.target.dataset.id) return;
  await api(`/documents/${e.target.dataset.id}`, { method: "DELETE" });
  refresh();
};

$("ask").onsubmit = async e => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question) return;
  $("q").value = "";
  add("user", esc(question));
  const pending = add("bot", "<span class='muted'>Thinking…</span>");
  try {
    const r = await api("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, session_id: sessionId }) });
    sessionId = r.session_id;
    const sources = r.sources.map(s =>
      `<div class="src"><b>[${s.n}] ${esc(s.doc_name)} p.${s.page}</b> (score ${s.score})<br>${esc(s.text)}</div>`).join("");
    pending.innerHTML = esc(r.answer) + (sources ? `<details><summary>Sources · searched: “${esc(r.search_query)}”</summary>${sources}</details>` : "");
  } catch (err) { pending.textContent = "Error: " + err.message; }
};

$("reset").onclick = async () => {
  if (sessionId) await api(`/chat/${sessionId}`, { method: "DELETE" });
  sessionId = null;
  $("log").innerHTML = '<div class="msg">New conversation started.</div>';
};

refresh();
</script>
</body>
</html>
